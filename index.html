    // National Postal Pincode API Resolver & Cache
    const pincodeCacheMap = new Map();
    async function lookupPostalPincode(pincode) {
      const clean = String(pincode || '').replace(/\D/g, '').trim();
      if (clean.length !== 6) return null;
      if (pincodeCacheMap.has(clean)) return pincodeCacheMap.get(clean);

      const stored = Storage.get('pincode_cache_' + clean, null);
      if (stored) {
        pincodeCacheMap.set(clean, stored);
        return stored;
      }

      try {
        const response = await fetch(`https://api.postalpincode.in/pincode/${clean}`);
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data[0]?.Status === 'Success' && data[0]?.PostOffice?.length > 0) {
            const po = data[0].PostOffice[0];
            const result = {
              pincode: clean,
              name: po.Name || 'Area Hub',
              district: po.District || '',
              state: po.State || '',
              display: `${po.Name}, ${po.District} (${po.State})`,
              short: `${po.Name}, ${po.District}`
            };
            pincodeCacheMap.set(clean, result);
            Storage.set('pincode_cache_' + clean, result);
            return result;
          }
        }
      } catch (err) {
        console.warn('Pincode API lookup error:', err);
      }

      // Offline fallbacks for common cities

        '134102': { pincode: '134102', name: 'Pinjore', district: 'Panchkula', state: 'Haryana', display: 'Pinjore, Panchkula (Haryana)', short: 'Pinjore, Panchkula' },

      // Hindi Text-To-Speech (TTS)
      const speakInHindi = (text, onEnd) => {
        if (!('speechSynthesis' in window) || isMuted) {
          if (onEnd) onEnd();
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/[*#_~`]/g, '').trim();
          const utterance = new SpeechSynthesisUtterance(cleanText);
          const voices = window.speechSynthesis.getVoices();
          const hindiVoice = voices.find(v => v.lang && (v.lang.startsWith('hi') || v.lang.includes('IN'))) || voices[0];
          if (hindiVoice) utterance.voice = hindiVoice;
          utterance.lang = 'hi-IN';
          utterance.rate = 0.95;
          utterance.pitch = 1.0;

          utterance.onstart = () => setVoiceState('speaking');
          utterance.onend = () => {
            setVoiceState('idle');
            if (onEnd) onEnd();
          };
          utterance.onerror = () => setVoiceState('idle');
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          setVoiceState('idle');
        }
      };

      const stopSpeaking = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

      // Voice Input: Start Listening (STT)
      const startListening = () => {
        stopSpeaking();
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Web Speech API is not supported in this browser. You can type your request in Hindi or English below.');
          return;
        }

        try {
          if (speechRecRef.current) {
            try { speechRecRef.current.stop(); } catch (e) {}
          }

          const rec = new SpeechRec();
          rec.lang = 'hi-IN';
          rec.interimResults = true;
          rec.maxAlternatives = 1;

          rec.onstart = () => {
            setVoiceState('listening');
            setVoiceTranscript('');
          };

          rec.onresult = (event) => {
            let current = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              current += event.results[i][0].transcript;
            }
            setVoiceTranscript(current);

            if (event.results[0].isFinal) {
              handleProcessVoiceQuery(current);
            }
          };

          rec.onerror = (event) => {
            console.warn('Speech recognition error:', event.error);
            setVoiceState('idle');
          };

          rec.onend = () => {
            setVoiceState(prev => prev === 'listening' ? 'idle' : prev);
          };

          speechRecRef.current = rec;
          rec.start();
        } catch (err) {
          console.warn('Speech start error:', err);

      };

      // Zupix AI Assistant Message Handler
      const sendAIMessage = async (customText) => {

        setTimeout(async () => {

          } else {
            // Service category detection

              matchedCat = 'Plumbing';
            } else if (lower.includes('इलेक्ट्रीशियन') || lower.includes('बिजली') || lower.includes('लाइट') || lower.includes('पंखा') || lower.includes('electr')) {
              matchedCat = 'Electrical';

      // Download FamPay Black QR helper

        try {
          const canvas = document.createElement('canvas');
          canvas.width = 400;
          canvas.height = 490;
          const ctx = canvas.getContext('2d');
          
          // Dark sleek container
          ctx.fillStyle = '#090d16';
          ctx.fillRect(0, 0, 400, 490);
          
          // Header Banner

          ctx.font = '900 20px sans-serif';
          ctx.textAlign = 'center';

          ctx.font = 'bold 14px monospace';
          ctx.fillText(`${FAMPAY_PAYEE_NAME} • ${FAMPAY_UPI_ID}`, 200, 68);
          
          // White QR background frame
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(45, 90, 310, 310, 16) : ctx.rect(45, 90, 310, 310);
          ctx.fill();
          
          // QR Graphic Elements
          ctx.fillStyle = '#000000';
          // 3 Alignment Targets
          ctx.fillRect(65, 110, 65, 65);
          ctx.clearRect(75, 120, 45, 45);
          ctx.fillRect(85, 130, 25, 25);
          
          ctx.fillRect(270, 110, 65, 65);
          ctx.clearRect(280, 120, 45, 45);
          ctx.fillRect(290, 130, 25, 25);
          
          ctx.fillRect(65, 315, 65, 65);
          ctx.clearRect(75, 325, 45, 45);
          ctx.fillRect(85, 335, 25, 25);

          ctx.fillRect(150, 190, 50, 50);
          ctx.fillRect(220, 210, 40, 40);
          ctx.fillRect(280, 210, 45, 45);
          ctx.fillRect(150, 260, 45, 45);

          ctx.fillRect(150, 330, 35, 35);
          ctx.fillRect(205, 330, 60, 35);

          // Footer

          ctx.font = 'bold 15px sans-serif';
          ctx.fillText(`Scan & Pay ₹${amount} with Any UPI App`, 200, 435);
          ctx.fillStyle = '#64748b';

            message: `Prepaid Partner Wallet recharged successfully via FamPay (${FAMPAY_UPI_ID}). Direct customer calls active!`,
            time: 'Just now',
            isRead: false
          };
          setNotifications(prev => [newNotif, ...prev]);
        }, 600);
      };

      // Instant ₹20 Payment Initiation (with Smart Booking Lock check on Worker Partner Wallet)
      const handleTriggerPayment = (worker) => {
        const targetWorker = workers.find(w => w.id === worker.id) || worker;
        const currentBal = targetWorker.walletBalance !== undefined ? targetWorker.walletBalance : 100;
        
        // Smart Booking Lock: Worker must maintain balance >= ₹20
        if (currentBal < 20) {
          setBlockedWorker({ ...targetWorker, walletBalance: currentBal });
          return;
        }

        setPaymentModalWorker({ ...targetWorker, walletBalance: currentBal });
        setPaymentSuccessState(null);
        setIsProcessingPayment(false);
      };

      // Open Booking Modal with Smart Booking Lock check
      const handleOpenBookModal = (worker) => {
        const targetWorker = workers.find(w => w.id === worker.id) || worker;
        const currentBal = targetWorker.walletBalance !== undefined ? targetWorker.walletBalance : 100;
        
        // Smart Booking Lock: Block if worker balance < ₹20
        if (currentBal < 20) {
          setBlockedWorker({ ...targetWorker, walletBalance: currentBal });
          return;
        }
        setBookModalWorker(targetWorker);
      };

      // Instant Payment Execution (FamPay UPI with zero friction & Green Tick)
      const handleExecuteInstantPayment = (paymentMethod = 'FamPay UPI 1-Tap') => {
        if (!paymentModalWorker) return;
        setIsProcessingPayment(true);

        setTimeout(() => {
          setIsProcessingPayment(false);
          const txnId = 'FAM' + Math.floor(10000000 + Math.random() * 90000000);
          const successData = {
            workerId: paymentModalWorker.id,
            workerName: paymentModalWorker.name,
            phone: paymentModalWorker.phone,
            amount: 20,
            txnId,
            date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
            method: paymentMethod,
            upiId: FAMPAY_UPI_ID,
            payee: FAMPAY_PAYEE_NAME
          };
          setPaymentSuccessState(successData);

          // Permanently unlock this worker's number
          const updatedUnlocked = Array.from(new Set([...unlockedWorkers, paymentModalWorker.id]));
          setUnlockedWorkers(updatedUnlocked);
          Storage.set('unlocked_workers', updatedUnlocked);

          // Deduct ₹20 platform lead fee from worker's partner wallet
          const updatedWorkers = workers.map(w => {
            if (w.id === paymentModalWorker.id) {
              const currentBal = w.walletBalance !== undefined ? w.walletBalance : 100;
              const newBal = Math.max(0, currentBal - 20);
              return { ...w, walletBalance: newBal };
            }
            return w;
          });
          setWorkers(updatedWorkers);
          Storage.set('workers', updatedWorkers);

          // Add to bookings & payment history
          const newBookingEntry = {
            id: 'b-pay-' + Date.now(),
            txnId,
            workerId: paymentModalWorker.id,
            workerName: paymentModalWorker.name,
            workerPhone: paymentModalWorker.phone,
            serviceName: paymentModalWorker.category,
            customerName: currentUser?.name || 'Customer',
            customerPhone: currentUser?.phone || '9876543210',
            address: paymentModalWorker.address || (currentUser?.address || 'Direct Service Locality'),
            scheduledDate: new Date().toISOString().split('T')[0],
            scheduledTime: 'Instant Direct Call',
            amountPaid: 20,
            paymentStatus: 'PAID & UNLOCKED',
            isUnlocked: true,
            status: 'confirmed',
            createdAt: new Date().toISOString()
          };

          const nextBookings = [newBookingEntry, ...bookings];
          setBookings(nextBookings);
          Storage.set('bookings', nextBookings);

          // Add notification
          const newNotif = {
            id: 'n-' + Date.now(),
            title: 'Payment Successful (₹20)',
            message: `Verified contact unlocked for ${paymentModalWorker.name} (${paymentModalWorker.category}). Call directly now!`,
            time: 'Just now',
            isRead: false
          };
          const nextNotifs = [newNotif, ...notifications];
          setNotifications(nextNotifs);
          Storage.set('notifications', nextNotifs);

          safeFirestore(async (firestore) => {
            await firestore.collection('bookings').doc(newBookingEntry.id).set(newBookingEntry);
          }, null);
        }, 500);
      };

      // Create Booking Request
      const handleCreateBooking = (e) => {
        e.preventDefault();
        const form = e.target;
        const newBooking = {
          id: 'b-' + Date.now(),
          txnId: 'FAM' + Math.floor(10000000 + Math.random() * 90000000),
          workerId: bookModalWorker.id,
          workerName: bookModalWorker.name,
          workerPhone: bookModalWorker.phone,
          serviceName: bookModalWorker.category,
          customerName: form.cname.value.trim(),
          customerPhone: form.cphone.value.replace(/\D/g, ''),
          address: form.caddress.value.trim(),
          scheduledDate: form.cdate.value,
          scheduledTime: form.ctime.value,
          amountPaid: 20,
          paymentStatus: 'PAID & UNLOCKED',
          isUnlocked: true,
          status: 'confirmed',
          createdAt: new Date().toISOString()
        };

        const updatedUnlocked = Array.from(new Set([...unlockedWorkers, bookModalWorker.id]));
        setUnlockedWorkers(updatedUnlocked);
        Storage.set('unlocked_workers', updatedUnlocked);

        // Deduct ₹20 platform lead fee from worker's partner wallet
        const updatedWorkers = workers.map(w => {
          if (w.id === bookModalWorker.id) {
            const currentBal = w.walletBalance !== undefined ? w.walletBalance : 100;
            const newBal = Math.max(0, currentBal - 20);
            return { ...w, walletBalance: newBal };
          }
          return w;
        });
        setWorkers(updatedWorkers);
        Storage.set('workers', updatedWorkers);

        const updated = [newBooking, ...bookings];
        setBookings(updated);
        Storage.set('bookings', updated);

        // Add Notification
        const newNotif = {
          id: 'n-' + Date.now(),
          title: 'Booking & Contact Confirmed',
          message: `Booking with ${bookModalWorker.name} (${bookModalWorker.category}) is scheduled on ${newBooking.scheduledDate}. Verified phone line unlocked!`,
          time: 'Just now',
          isRead: false
        };
        const updatedNotifs = [newNotif, ...notifications];
        setNotifications(updatedNotifs);
        Storage.set('notifications', updatedNotifs);

        safeFirestore(async (firestore) => {
          await firestore.collection('bookings').doc(newBooking.id).set(newBooking);
        }, null);

        setBookModalWorker(null);
        setActiveTab('bookings');
      };

      // Reusable Zupix AI Assistant Widget (Delegated to physical 100% visible Jarvis HTML widget)
      const renderAiWidget = () => null;

      // ============================================================

      if (authFlowState === 'onboarding') {

              </div>

              {/* Dots Indicator */}

            </div>

            {/* Bottom Actions */}
            <div className="max-w-lg mx-auto w-full space-y-3">
              <div className="grid grid-cols-2 gap-3">

            {/* Persistent AI Voice Widget */}

                    onClick={() => {
                      localStorage.clear();
                      alert('Local cache reset! Reloading...');
                      window.location.reload();
                    }}
                    className="w-full py-2.5 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-bold hover:bg-rose-600/30"
                  >
                    Clear All Cache & Reset Seed Data
                  </button>
                  <button 
                    onClick={() => setIsAdminOpen(false)}
                    className="w-full py-2 rounded-xl text-slate-400 hover:text-white text-xs font-bold"
                  >
                    Close Admin Console
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Persistent AI Voice Widget */}
          {renderAiWidget()}

        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
  let isZupixMuted = false;
  let isZupixListening = false;
  let zupixSpeechRec = null;

  const ZUPIX_LOCAL_DATABASE = [
    { id: 'w-sunil-delhi', name: 'Sunil Kumar', phone: '9811002233', category: 'Electrical', pincode: '110001', city: 'Delhi', hourlyRate: 299, spec: 'Full house wiring, MCB replacement' },
    { id: 'w-rajesh-mumbai', name: 'Rajesh Patil', phone: '9820011223', category: 'Plumbing', pincode: '400001', city: 'Mumbai', hourlyRate: 350, spec: 'High-rise pipe fitting, water tank, bath fittings' },
    { id: 'w-arjun-blr', name: 'Arjun Gowda', phone: '9845012345', category: 'AC & Refrigeration', pincode: '560001', city: 'Bengaluru', hourlyRate: 399, spec: 'HVAC repair, Inverter AC gas refill' },
    { id: 'w-tariq-dxb', name: 'Tariq Mansoor', phone: '971501234567', category: 'Electrical', pincode: '00000', city: 'Dubai', hourlyRate: 500, spec: 'Smart home electricals, lighting, breakers' },
    { id: 'w-michael-nyc', name: 'Michael Miller', phone: '12125550199', category: 'Plumbing', pincode: '10001', city: 'New York', hourlyRate: 600, spec: 'Master plumber, drain unclogging, pipe repair' },
    { id: 'w-ramesh-1', name: 'Ramesh Sharma', phone: '9876543210', category: 'Plumbing', pincode: '134102', city: 'Pinjore', hourlyRate: 299, spec: 'Pipe Leaks, Sanitary Fitting, Motor Repair' },
    { id: 'w-kuldeep-2', name: 'Kuldeep Singh', phone: '9812345678', category: 'Electrical', pincode: '134102', city: 'Pinjore', hourlyRate: 250, spec: 'Short Circuit, MCB Tripping, Inverter Setup' },
    { id: 'w-anil-doc', name: 'Dr. Anil Verma (MBBS)', phone: '9896011223', category: 'Doctor / General Physician', pincode: '134102', city: 'Pinjore', hourlyRate: 350, spec: 'General Physician, Fever, Home Visit' }
  ];

  function toggleZupixAI() {
      const box = document.getElementById('zupix-ai-window');
      if (!box) return;
      const willOpen = box.style.display === 'none';
      box.style.display = willOpen ? 'block' : 'none';
      if (willOpen) {
          const input = document.getElementById('zupix-user-input');
          if (input) setTimeout(() => input.focus(), 100);
      }
  }
  window.toggleZupixAI = toggleZupixAI;

  function toggleZupixSound(e) {
      if (e) e.stopPropagation();
      isZupixMuted = !isZupixMuted;
      const btn = document.getElementById('zupix-sound-toggle');
      if (btn) btn.textContent = isZupixMuted ? '🔇' : '🔊';
      if (isZupixMuted && window.speechSynthesis) {
          window.speechSynthesis.cancel();
      }
  }

  function handleZupixKeyPress(e) {
      if (e.key === 'Enter') {
          sendZupixMessage();
      }
  }

  function setQuickPrompt(text) {
      const input = document.getElementById('zupix-user-input');
      if (input) input.value = text;
      sendZupixMessage(text);
  }

  function speakZupixAudio(text, lang = 'hi-IN') {
      if (isZupixMuted || !('speechSynthesis' in window)) return;
      try {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/https?:\/\/\S+/g, '');
          const utter = new SpeechSynthesisUtterance(cleanText);
          utter.lang = lang;
          utter.rate = 1.0;
          utter.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices();
          if (lang.startsWith('hi')) {
              const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('HI'));
              if (hindiVoice) utter.voice = hindiVoice;
          } else {
              const engVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB') || v.lang.includes('en-IN'));
              if (engVoice) utter.voice = engVoice;
          }
          window.speechSynthesis.speak(utter);
      } catch(e) {}
  }

  function startVoiceInput() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const wave = document.getElementById('ai-wave-container');
      const voiceBtn = document.getElementById('zupix-voice-btn');
      const statusText = document.getElementById('ai-status-text');

      if (!SpeechRec) {
          if (wave) {
              if (statusText) statusText.textContent = "Listening... / सुन रहा हूँ...";
              wave.style.display = 'block';
          }
          if (voiceBtn) voiceBtn.style.background = '#fee2e2';
          setTimeout(() => {
              if (wave) wave.style.display = 'none';
              if (voiceBtn) voiceBtn.style.background = '#f3f4f6';
              const input = document.getElementById('zupix-user-input');
              if (input) input.value = "Need plumber in Delhi";
              sendZupixMessage();
          }, 1800);
          return;
      }

      if (isZupixListening) {
          if (zupixSpeechRec) {
              try { zupixSpeechRec.stop(); } catch(e){}
          }
          isZupixListening = false;
          if (wave) wave.style.display = 'none';
          if (voiceBtn) {
              voiceBtn.style.background = '#f3f4f6';
              voiceBtn.style.color = '#374151';
          }
          return;
      }

      try {
          const rec = new SpeechRec();
          rec.lang = 'hi-IN'; // Will pick up both Hindi and English accurately
          rec.continuous = false;
          rec.interimResults = false;

          rec.onstart = function() {
              isZupixListening = true;
              if (wave) {
                  if (statusText) statusText.textContent = "Listening (बोलें / Speak)...";
                  wave.style.display = 'block';
              }
              if (voiceBtn) {
                  voiceBtn.style.background = '#ef4444';
                  voiceBtn.style.color = 'white';
              }
          };

          rec.onresult = function(e) {
              const transcript = e.results[0][0].transcript;
              const input = document.getElementById('zupix-user-input');
              if (input) input.value = transcript;
              sendZupixMessage(transcript);
          };

          rec.onerror = function() {
              isZupixListening = false;
              if (wave) wave.style.display = 'none';
              if (voiceBtn) {
                  voiceBtn.style.background = '#f3f4f6';
                  voiceBtn.style.color = '#374151';
              }
          };

          rec.onend = function() {
              isZupixListening = false;
              if (wave) wave.style.display = 'none';
              if (voiceBtn) {
                  voiceBtn.style.background = '#f3f4f6';
                  voiceBtn.style.color = '#374151';
              }
          };

          zupixSpeechRec = rec;
          rec.start();
      } catch(err) {
          if (wave) {
              if (statusText) statusText.textContent = "Listening... / सुन रहा हूँ...";
              wave.style.display = 'block';
          }
          setTimeout(() => {
              if (wave) wave.style.display = 'none';
              const input = document.getElementById('zupix-user-input');
              if (input) input.value = "Need plumber in Delhi";
              sendZupixMessage();
          }, 1500);
      }
  }

  async function sendZupixMessage(customText) {
      const input = document.getElementById('zupix-user-input');
      const messages = document.getElementById('zupix-chat-messages');
      const text = (customText || (input ? input.value : '')).trim();
      if (!text) return;

      // User Message Bubble
      const userMsg = document.createElement('div');
      userMsg.style.cssText = "background: #4F46E5; color: white; padding: 10px 14px; border-radius: 12px; max-width: 85%; align-self: flex-end; line-height: 1.4; word-break: break-word;";
      userMsg.textContent = text;
      messages.appendChild(userMsg);
      if (input) input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Dynamic Language Detection: Hindi vs English
      const hasDevanagari = /[\u0900-\u097F]/.test(text);
      const hindiKeywords = ['chahiye', 'karo', 'namaste', 'bhai', 'mera', 'kaun', 'hai', 'kaha', 'dhoondo', 'madad', 'paani', 'bijli'];
      const textLower = text.toLowerCase();
      const isHindi = hasDevanagari || hindiKeywords.some(k => textLower.includes(k));

      // Show Wave / Processing Animation
      const wave = document.getElementById('ai-wave-container');
      const statusText = document.getElementById('ai-status-text');
      if (statusText) statusText.textContent = isHindi ? "प्रोसेस कर रहा हूँ... / ढूँढ रहा हूँ..." : "Processing request... Finding specialists...";
      if (wave) wave.style.display = 'block';

      // Detect 6-digit or 5-digit Pincode / Postal code
      let targetPincode = null;
      const pinMatch = text.match(/\b\d{5,6}\b/);
      if (pinMatch) targetPincode = pinMatch[0];

      let locality = "";
      if (targetPincode && targetPincode.length === 6) {
          try {
              const res = await fetch('https://api.postalpincode.in/pincode/' + targetPincode);
              if (res.ok) {
                  const data = await res.json();
                  if (data && data[0] && data[0].Status === 'Success' && data[0].PostOffice && data[0].PostOffice[0]) {
                      const po = data[0].PostOffice[0];
                      locality = `${po.Name}, ${po.District} (${po.State})`;
                  }
              }
          } catch(e) {}
      }

      // Detect city
      let targetCity = null;
      if (textLower.includes('delhi') || textLower.includes('दिल्ली')) targetCity = 'Delhi';
      else if (textLower.includes('mumbai') || textLower.includes('बॉम्बे') || textLower.includes('मुंबई')) targetCity = 'Mumbai';
      else if (textLower.includes('bengaluru') || textLower.includes('bangalore') || textLower.includes('बैंगलोर')) targetCity = 'Bengaluru';
      else if (textLower.includes('dubai') || textLower.includes('दुबई')) targetCity = 'Dubai';
      else if (textLower.includes('new york') || textLower.includes('nyc') || textLower.includes('न्यूयॉर्क')) targetCity = 'New York';
      else if (textLower.includes('pinjore') || textLower.includes('panchkula') || textLower.includes('पिंजौर') || textLower.includes('पंचकूला')) targetCity = 'Pinjore';

      let targetCategory = null;
      if (textLower.includes('plumb') || textLower.includes('नल') || textLower.includes('पानी') || textLower.includes('लीक') || textLower.includes('मोटर') || textLower.includes('टैंक') || textLower.includes('पाइप')) targetCategory = 'Plumbing';
      else if (textLower.includes('elect') || textLower.includes('बिजली') || textLower.includes('लाइट') || textLower.includes('तार') || textLower.includes('पंखा') || textLower.includes('शॉर्ट')) targetCategory = 'Electrical';
      else if (textLower.includes('doc') || textLower.includes('डॉक्टर') || textLower.includes('बीमार') || textLower.includes('दवा') || textLower.includes('fever') || textLower.includes('clinic')) targetCategory = 'Doctor / General Physician';
      else if (textLower.includes('ac') || textLower.includes('कूलिंग') || textLower.includes('refrigeration')) targetCategory = 'AC & Refrigeration';

      // Load workers from database or fallback
      let allWorkers = ZUPIX_LOCAL_DATABASE;
      try {
          const saved = localStorage.getItem('zupix_workers') || localStorage.getItem('zupix_workers_v2');
          if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) allWorkers = parsed;
          }
      } catch(e){}

      let matched = allWorkers;
      if (targetPincode) {
          const pinFiltered = allWorkers.filter(w => w.pincode === targetPincode);
          if (pinFiltered.length > 0) matched = pinFiltered;
      } else if (targetCity) {
          const cityFiltered = allWorkers.filter(w => (w.city && w.city.toLowerCase() === targetCity.toLowerCase()) || (w.address && w.address.toLowerCase().includes(targetCity.toLowerCase())));
          if (cityFiltered.length > 0) matched = cityFiltered;
      }

      if (targetCategory) {
          const catFiltered = matched.filter(w => w.category && w.category.toLowerCase().includes(targetCategory.toLowerCase()));
          if (catFiltered.length > 0) matched = catFiltered;
      }

      // If no direct matches, dynamically provide top verified pros
      if (matched.length === 0) {
          matched = allWorkers.slice(0, 3);
      }

      // AI Smart Response Generation
      setTimeout(() => {
          if (wave) wave.style.display = 'none';
          const aiMsg = document.createElement('div');
          aiMsg.style.cssText = "background: #e0e7ff; color: #1e1b4b; padding: 12px 14px; border-radius: 14px; max-width: 92%; align-self: flex-start; line-height: 1.4; display: flex; flex-direction: column; gap: 8px;";
          
          let reply = "";
          let speechText = "";

          if (isHindi) {
              if (targetPincode) {
                  reply = `मैंने आपकी बात समझ ली है! पिन कोड <strong>${targetPincode}</strong> ${locality ? `(${locality})` : ''} पर उपलब्ध सत्यापित विशेषज्ञ ढूंढ लिए गए हैं:`;
                  speechText = `पिन कोड ${targetPincode} पर उपलब्ध सत्यापित विशेषज्ञ Zupix पर तैयार हैं।`;
              } else if (targetCity) {
                  reply = `<strong>${targetCity}</strong> क्षेत्र के लिए शीर्ष सत्यापित प्रो ढूंढ लिए गए हैं:`;
                  speechText = `${targetCity} क्षेत्र के लिए सत्यापित प्रोफेशनल्स मिल गए हैं।`;
              } else {
                  reply = `मैंने आपकी आवश्यकता समझ ली है! आपके बताए गए स्थान के अनुसार उपलब्ध विशेषज्ञ:`;
                  speechText = `आपकी सेवा के लिए उपलब्ध विशेषज्ञ Zupix पर तैयार हैं।`;
              }
          } else {
              if (targetPincode) {
                  reply = `I have processed your request! Found verified specialists for Postal Code <strong>${targetPincode}</strong> ${locality ? `(${locality})` : ''}:`;
                  speechText = `Found verified specialists for postal code ${targetPincode}.`;
              } else if (targetCity) {
                  reply = `Located top verified specialists serving <strong>${targetCity}</strong>:`;
                  speechText = `Located top verified specialists serving ${targetCity}.`;
              } else {
                  reply = `I have found verified specialists matching your request for "<strong>${text}</strong>":`;
                  speechText = `I have found verified specialists matching your request.`;
              }
          }

          let cardsHtml = '';
          if (matched && matched.length > 0) {
              cardsHtml = '<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">';
              matched.slice(0, 3).forEach(p => {
                  const locationText = p.city || p.pincode || 'Local Hub';
                  cardsHtml += `
                    <div style="background: white; border: 1px solid #c7d2fe; border-radius: 12px; padding: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                      <div>
                        <strong style="color: #1e1b4b; font-size: 13px;">${p.name}</strong>
                        <div style="color: #4338ca; font-size: 11px;">${p.category || 'Specialist'} • 📍 ${locationText}</div>
                        <div style="color: #059669; font-weight: bold; font-size: 12px; margin-top: 2px;">₹${p.hourlyRate || 250} Visit • ₹20 Platform Fee</div>
                      </div>
                      <a href="tel:${p.phone || '9876543210'}" style="background: #059669; color: white; padding: 7px 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);">
                        <span>📞</span>
                        <span>${isHindi ? 'कॉल करें' : 'Call'}</span>
                      </a>
                    </div>
                  `;
              });
              cardsHtml += '</div>';
          }

          aiMsg.innerHTML = `<div>${reply}</div>${cardsHtml}`;
          messages.appendChild(aiMsg);
          messages.scrollTop = messages.scrollHeight;

          speakZupixAudio(speechText, isHindi ? 'hi-IN' : 'en-US');
      }, 600);
  }
