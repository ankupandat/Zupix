  <!-- COMPLETE ALL-IN-ONE ZUPIX APPLICATION CODE -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================
    // 1. FIREBASE CONFIGURATION & LOCAL STORAGE PERSISTENCE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCgcV8rnJYc5o8mRqi0sVs8nDoPhp7MlNw",
      authDomain: "lexical-plexus-3wjrd.firebaseapp.com",
      projectId: "lexical-plexus-3wjrd",
      storageBucket: "lexical-plexus-3wjrd.firebasestorage.app",
      messagingSenderId: "96423207903",
      appId: "1:96423207903:web:b853a90e1f4095153f5a6a"
    };

    let db = null;
    let auth = null;
    try {
      if (typeof firebase !== 'undefined' && firebase.apps) {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        if (firebase.firestore) {
          try { firebase.firestore.setLogLevel('silent'); } catch (e) {}
          db = firebase.firestore();
        }
        if (firebase.auth) {
          auth = firebase.auth();
        }
      }
    } catch (e) {
      db = null;
    }

    const safeFirestore = async (fn, fallback) => {
      if (!db) return typeof fallback === 'function' ? fallback() : fallback;
      try {
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500));
        return await Promise.race([fn(db), timeoutPromise]);
      } catch (err) {
        if (err && (err.code === 'not-found' || err.message?.includes('not exist') || err.message === 'timeout')) {
          try { db.disableNetwork(); } catch (e) {}
          db = null;
        }
        return typeof fallback === 'function' ? fallback() : fallback;
      }
    };

    const Storage = {
      get: (key, def) => {
        try {
          const item = localStorage.getItem('zupix_' + key) || localStorage.getItem('zupix_' + key + '_v2');
          return item ? JSON.parse(item) : def;
        } catch { return def; }
      },
      set: (key, val) => {
        try {
          localStorage.setItem('zupix_' + key, JSON.stringify(val));
          localStorage.setItem('zupix_' + key + '_v2', JSON.stringify(val));
        } catch {}
      }
    };

    // Supported Languages
    const LANGUAGES = [
      { code: 'en', name: 'English', native: 'English' },
      { code: 'hi', name: 'Hindi', native: 'हिन्दी' },
      { code: 'pa', name: 'Punjabi', native: 'ਪੰਜਾਬੀ' },
      { code: 'bn', name: 'Bengali', native: 'বাংলা' },
      { code: 'mr', name: 'Marathi', native: 'मराठी' },
      { code: 'te', name: 'Telugu', native: 'తెలుగు' },
      { code: 'ta', name: 'Tamil', native: 'தமிழ்' },
      { code: 'gu', name: 'Gujarati', native: 'ગુજરાતી' }
    ];

    // Supported Countries
    const COUNTRIES = [
      { code: 'IN', dial: '+91', name: 'India', flag: '🇮🇳' },
      { code: 'AE', dial: '+971', name: 'United Arab Emirates', flag: '🇦🇪' },
      { code: 'GB', dial: '+44', name: 'United Kingdom', flag: '🇬🇧' },
      { code: 'US', dial: '+1', name: 'United States', flag: '🇺🇸' },
      { code: 'CA', dial: '+1', name: 'Canada', flag: '🇨🇦' },
      { code: 'AU', dial: '+61', name: 'Australia', flag: '🇦🇺' }
    ];

    // 10 Official Specialist Trade Categories
    const CATEGORIES = [
      { name: 'All', icon: '✨', label: 'All Services', subtitle: 'Browse all local trades' },
      { name: 'Doctor / General Physician', icon: '🩺', label: 'Doctors', subtitle: 'Consultations, emergency visit, family health' },
      { name: 'Plumbing', icon: '🔧', label: 'Plumbing', subtitle: 'Pipe leaks, taps, motor fitting, sanitary' },
      { name: 'Electrical', icon: '⚡', label: 'Electrical', subtitle: 'Wiring, MCB, inverter setup, short-circuits' },
      { name: 'Mechanic / Vehicle Repair', icon: '🚗', label: 'Mechanic', subtitle: 'Car & bike breakdown, puncture, engine' },
      { name: 'AC & Refrigeration', icon: '❄️', label: 'AC Repair', subtitle: 'Gas refill, compressor, regular servicing' },
      { name: 'Salon & Makeup', icon: '✂️', label: 'Beauty / Salon', subtitle: 'Haircut, facial, waxing, bridal grooming' },
      { name: 'Carpentry', icon: '🪚', label: 'Carpentry', subtitle: 'Doors, furniture repair, wooden fittings' },
      { name: 'Cleaning & Pest Control', icon: '🧹', label: 'Cleaning', subtitle: 'Deep home cleaning, sofa, pest fumigation' },
      { name: 'Home Painting', icon: '🎨', label: 'Painting', subtitle: 'Interior/exterior walls, waterproof coating' },
      { name: 'Appliance Repair', icon: '🔥', label: 'Appliances', subtitle: 'Washing machine, microwave, geyser, RO' }
    ];

    // 4 Onboarding Slides
    const ONBOARDING_SLIDES = [
      {
        badge: '100% Free Platform',
        title: 'Instant Access to Verified Local',
        highlight: 'Doctors & Specialists',
        description: 'Find trusted electricians, plumbers, physicians, salon experts, and home technicians right in your area with zero platform fees.',
        icon: '🩺',
        features: ['Direct Phone Contact', '100% Free for Everyone', 'Instant Area Matching'],
        gradient: 'from-blue-600 to-indigo-700'
      },
      {
        badge: 'Direct Phone Guidance',
        title: 'Direct Call & Real-Time',
        highlight: 'Location & Fee Confirmation',
        description: 'Confirm service charges and your exact address directly over a quick phone call with the provider. Direct voice communication with zero markups.',
        icon: '📞',
        features: ['Confirm Rates on Phone', 'Live Voice Address Help', 'Zero Intermediaries'],
        gradient: 'from-indigo-600 to-violet-700'
      },
      {
        badge: 'Empowering Local Experts',
        title: 'Grow Your Service Business as a',
        highlight: 'Verified Pro Partner',
        description: 'Join thousands of electricians, doctors, and craftsmen receiving direct customer calls in your area every day with 0% commission.',
        icon: '💼',
        features: ['100% Free Pro Listings', 'Keep 100% of Earnings', 'Full Schedule Freedom'],
        gradient: 'from-teal-600 to-emerald-700'
      },
      {
        badge: 'Safe & Verified',
        title: 'Fast, Verified & Safe for',
        highlight: 'Every Household',
        description: 'Secure OTP-verified accounts with genuine verified specialist profiles, ratings, and one-account-per-number integrity.',
        icon: '🛡️',
        features: ['Real-Time Phone OTP', 'Identity Verified Pros', 'Transparent Community'],
        gradient: 'from-blue-700 via-indigo-800 to-slate-900'
      }
    ];

    // Live Animated Brand Icon
    const LiveAppIcon = ({ size = "md" }) => {
      const dim = size === "sm" ? "w-8 h-8 text-base" : size === "lg" ? "w-16 h-16 text-3xl" : "w-10 h-10 text-xl";
      return (
        <div className={`relative ${dim} rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-blue-700 flex items-center justify-center text-white font-display font-black shadow-md shadow-blue-500/25 shrink-0`}>
          <span>Z</span>
          <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 border-2 border-white rounded-full animate-ping" />
          <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full" />
        </div>
      );
    };

    // ============================================================
    // 2. MAIN APPLICATION COMPONENT
    // ============================================================
    function App() {
      // User & Navigation States
      const [currentUser, setCurrentUser] = useState(() => Storage.get('user', null));
      const [authFlowState, setAuthFlowState] = useState(() => {
        const saved = Storage.get('user', null);
        return (saved && saved.isProfileComplete) ? 'authenticated' : 'onboarding';
      });

      // Active view tab: 'home' | 'bookings' | 'worker_dashboard' | 'profile' | 'provider_setup'
      const [activeTab, setActiveTab] = useState(() => {
        const saved = Storage.get('user', null);
        return saved?.role === 'worker' ? 'worker_dashboard' : 'home';
      });

      // Data states (STRICT ZERO DUMMY DATA: only real saved items)
      const [workers, setWorkers] = useState(() => Storage.get('workers', []));
      const [bookings, setBookings] = useState(() => Storage.get('bookings', []));
      const [notifications, setNotifications] = useState(() => Storage.get('notifications', []));

      // Language & Country
      const [lang, setLang] = useState('en');
      const [country, setCountry] = useState(COUNTRIES[0]);

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [pincodeFilter, setPincodeFilter] = useState(() => currentUser?.pincode || '134102');

      // Modals
      const [directCallWorker, setDirectCallWorker] = useState(null);
      const [bookModalWorker, setBookModalWorker] = useState(null);
      const [isNotifsOpen, setIsNotifsOpen] = useState(false);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [isLangMenuOpen, setIsLangMenuOpen] = useState(false);

      // Onboarding State
      const [onboardingSlide, setOnboardingSlide] = useState(0);
      const [authRoleChoice, setAuthRoleChoice] = useState('customer'); // 'customer' | 'worker'

      // Login Gateway State
      const [loginPhone, setLoginPhone] = useState('');
      const [loginOtp, setLoginOtp] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [otpTimer, setOtpTimer] = useState(0);

      // Profile Setup State
      const [setupName, setSetupName] = useState('');
      const [setupPhone, setSetupPhone] = useState('');
      const [setupPincode, setSetupPincode] = useState('134102');
      const [setupAddress, setSetupAddress] = useState('');
      const [setupRole, setSetupRole] = useState('customer');
      const [setupCategory, setSetupCategory] = useState('Plumbing');
      const [setupRate, setSetupRate] = useState('250');
      const [setupSpecialization, setSetupSpecialization] = useState('');
      const [setupBio, setSetupBio] = useState('');
      const [termsAccepted, setTermsAccepted] = useState(false);
      const [setupError, setSetupError] = useState('');

      // Hidden Admin Console trigger counter (3 rapid clicks on logo)
      const [logoClicks, setLogoClicks] = useState(0);
      const logoTimeoutRef = useRef(null);

      const handleLogoClick = () => {
        setLogoClicks(prev => {
          const next = prev + 1;
          if (next >= 3) {
            setIsAdminOpen(true);
            return 0;
          }
          return next;
        });
        if (logoTimeoutRef.current) clearTimeout(logoTimeoutRef.current);
        logoTimeoutRef.current = setTimeout(() => setLogoClicks(0), 1200);
      };

      // OTP Countdown Timer
      useEffect(() => {
        let interval = null;
        if (otpTimer > 0) {
          interval = setInterval(() => setOtpTimer(p => p - 1), 1000);
        }
        return () => clearInterval(interval);
      }, [otpTimer]);

      // Load remote workers from Firestore safely on boot
      useEffect(() => {
        safeFirestore(async (firestore) => {
          const snap = await firestore.collection('workers').get();
          if (snap && !snap.empty) {
            const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setWorkers(list);
            Storage.set('workers', list);
          }
        }, null);
      }, []);

      // Active Worker Profile (if user is registered provider)
      const currentWorkerProfile = useMemo(() => {
        if (!currentUser) return null;
        return workers.find(w => w.userId === currentUser.id || (w.phone && currentUser.phone && w.phone === currentUser.phone)) || null;
      }, [currentUser, workers]);

      // Filtered Specialists
      const filteredWorkers = useMemo(() => {
        return workers.filter(w => {
          const matchCategory = selectedCategory === 'All' || w.category === selectedCategory;
          const matchPincode = !pincodeFilter || w.pincode === pincodeFilter;
          const matchSearch = !searchQuery ||
            w.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            w.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
            w.specialization?.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCategory && matchPincode && matchSearch;
        });
      }, [workers, selectedCategory, pincodeFilter, searchQuery]);

      // Handle Send OTP
      const handleSendOtp = () => {
        const cleaned = loginPhone.replace(/\D/g, '');
        if (cleaned.length < 10) {
          alert('Please enter a valid 10-digit mobile number.');
          return;
        }
        setOtpSent(true);
        setOtpTimer(30);
        setLoginOtp('123456'); // Simulation preview code for instant entry
      };

      // Handle Verify OTP
      const handleVerifyOtp = () => {
        const cleaned = loginPhone.replace(/\D/g, '');
        if (!loginOtp || loginOtp.length < 4) {
          alert('Please enter the 6-digit OTP.');
          return;
        }
        
        // Check if user already exists
        const existingUsers = Storage.get('users_list', []);
        const found = existingUsers.find(u => u.phone === cleaned);

        if (found && found.isProfileComplete) {
          setCurrentUser(found);
          Storage.set('user', found);
          setAuthFlowState('authenticated');
          setActiveTab(found.role === 'worker' ? 'worker_dashboard' : 'home');
        } else {
          // Proceed to Profile Setup step
          setSetupPhone(cleaned);
          setSetupRole(authRoleChoice);
          setAuthFlowState('profile_setup');
        }
      };

      // Handle Complete Profile Setup
      const handleCompleteProfile = (e) => {
        e.preventDefault();
        setSetupError('');

        if (!setupName.trim()) {
          setSetupError('Please enter your full name.');
          return;
        }
        if (!setupPhone.trim() || setupPhone.replace(/\D/g, '').length < 10) {
          setSetupError('Please enter a valid 10-digit phone number.');
          return;
        }
        if (!setupPincode.trim()) {
          setSetupError('Please specify your 6-digit service pincode.');
          return;
        }
        if (!termsAccepted) {
          setSetupError('You must accept the Terms of Service & Privacy Policy to continue.');
          return;
        }

        const cleanPhone = setupPhone.replace(/\D/g, '');
        const newUser = {
          id: 'u-' + Date.now(),
          name: setupName.trim(),
          phone: cleanPhone,
          role: setupRole,
          pincode: setupPincode.trim(),
          address: setupAddress.trim() || 'Active Service Locality',
          isProfileComplete: true,
          createdAt: new Date().toISOString()
        };

        // If specialist, also register provider profile
        if (setupRole === 'worker') {
          const newWorker = {
            id: 'w-' + Date.now(),
            userId: newUser.id,
            name: newUser.name,
            phone: newUser.phone,
            category: setupCategory,
            pincode: newUser.pincode,
            address: newUser.address,
            hourlyRate: Number(setupRate) || 250,
            specialization: setupSpecialization.trim() || 'Verified Local Professional',
            bio: setupBio.trim() || 'Experienced specialist available for direct bookings and calls in your area.',
            rating: 5.0,
            reviewCount: 0,
            experienceYears: 4,
            isVerified: true,
            isAvailable: true
          };

          const updatedWorkers = [newWorker, ...workers.filter(w => w.phone !== cleanPhone)];
          setWorkers(updatedWorkers);
          Storage.set('workers', updatedWorkers);

          safeFirestore(async (firestore) => {
            await firestore.collection('workers').doc(newWorker.id).set(newWorker);
          }, null);
        }

        // Save User
        setCurrentUser(newUser);
        Storage.set('user', newUser);

        const existingUsers = Storage.get('users_list', []);
        Storage.set('users_list', [newUser, ...existingUsers.filter(u => u.phone !== cleanPhone)]);

        safeFirestore(async (firestore) => {
          await firestore.collection('users').doc(newUser.id).set(newUser);
        }, null);

        setPincodeFilter(newUser.pincode);
        setAuthFlowState('authenticated');
        setActiveTab(setupRole === 'worker' ? 'worker_dashboard' : 'home');
      };

      // Toggle Worker Availability
      const handleToggleAvailability = () => {
        if (!currentWorkerProfile) return;
        const updated = { ...currentWorkerProfile, isAvailable: !currentWorkerProfile.isAvailable };
        const updatedList = workers.map(w => w.id === updated.id ? updated : w);
        setWorkers(updatedList);
        Storage.set('workers', updatedList);

        safeFirestore(async (firestore) => {
          await firestore.collection('workers').doc(updated.id).update({ isAvailable: updated.isAvailable });
        }, null);
      };

      // Create Booking Request
      const handleCreateBooking = (e) => {
        e.preventDefault();
        const form = e.target;
        const newBooking = {
          id: 'b-' + Date.now(),
          workerId: bookModalWorker.id,
          workerName: bookModalWorker.name,
          workerPhone: bookModalWorker.phone,
          serviceName: bookModalWorker.category,
          customerName: form.cname.value.trim(),
          customerPhone: form.cphone.value.replace(/\D/g, ''),
          address: form.caddress.value.trim(),
          scheduledDate: form.cdate.value,
          scheduledTime: form.ctime.value,
          status: 'confirmed',
          createdAt: new Date().toISOString()
        };

        const updated = [newBooking, ...bookings];
        setBookings(updated);
        Storage.set('bookings', updated);

        // Add Notification
        const newNotif = {

                    className={`flex flex-col items-center justify-center flex-1 py-1 ${activeTab === 'home' ? 'text-blue-600' : 'text-slate-500'}`}
                  >
                    <span className="text-lg">🔍</span>
                    <span className="text-[10px] font-bold mt-0.5">Explore</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('bookings')}
                    className={`flex flex-col items-center justify-center flex-1 py-1 ${activeTab === 'bookings' ? 'text-blue-600' : 'text-slate-500'}`}
                  >
                    <span className="text-lg">📅</span>
                    <span className="text-[10px] font-bold mt-0.5">Bookings</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('profile')}
                    className={`flex flex-col items-center justify-center flex-1 py-1 ${activeTab === 'profile' ? 'text-blue-600' : 'text-slate-500'}`}
                  >
                    <span className="text-lg">👤</span>
                    <span className="text-[10px] font-bold mt-0.5">Profile</span>
                  </button>
                </>
              )}

            </div>
          </nav>

          {/* ============================================================ */}
          {/* 4. MODALS & POPUPS                                           */}
          {/* ============================================================ */}

          {/* A. DIRECT CALL MODAL */}
          {directCallWorker && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 text-2xl flex items-center justify-center mx-auto border border-emerald-200">
                  📞
                </div>
                <div>
                  <h3 className="text-lg font-display font-black text-slate-900 leading-tight">
                    Direct Call Specialist
                  </h3>
                  <p className="text-xs text-slate-500 mt-1">
                    Connect directly to <strong>{directCallWorker.name}</strong> ({directCallWorker.category}).
                  </p>
                </div>

                <div className="bg-emerald-50/80 border border-emerald-200 p-3.5 rounded-2xl">
                  <span className="text-[11px] font-bold text-emerald-800 uppercase tracking-wide">Direct Mobile Line</span>
                  <p className="text-lg font-mono font-black text-emerald-950 mt-0.5">
                    +{directCallWorker.phone}
                  </p>
                </div>

                <div className="text-[11px] text-slate-500">
                  🛡️ <strong>Zero commission:</strong> You speak directly with the specialist. No platform cut.
                </div>

                <div className="space-y-2 pt-2">
                  <a 
                    href={`tel:${directCallWorker.phone}`}
                    className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20"
                  >
                    <span>Dial Now ➔</span>
                  </a>
                  <button 
                    onClick={() => setDirectCallWorker(null)}
                    className="w-full py-2.5 rounded-xl text-slate-400 hover:text-slate-600 font-bold text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* B. BOOKING VISIT MODAL */}
          {bookModalWorker && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-display font-black text-slate-900 text-base">Book Visit: {bookModalWorker.name}</h3>
                  <button onClick={() => setBookModalWorker(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateBooking} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Your Full Name</label>
                    <input name="cname" required defaultValue={currentUser?.name || ''} className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Your Contact Phone</label>
                    <input name="cphone" required type="tel" defaultValue={currentUser?.phone || ''} className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Preferred Date</label>
                      <input name="cdate" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Preferred Time</label>
                      <input name="ctime" defaultValue="11:00 AM" required className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Complete Service Address in Pincode {bookModalWorker.pincode}</label>
                    <input name="caddress" required placeholder="House/Flat number, landmark, locality" className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" />
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs shadow-md transition cursor-pointer"
                  >
                    Confirm Free Booking Request ➔
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* C. NOTIFICATIONS DRAWER */}
          {isNotifsOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex justify-end">
              <div className="w-full max-w-sm bg-white h-full p-5 shadow-2xl space-y-4 overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-display font-black text-slate-900 text-base">Notifications</h3>
                  <button onClick={() => setIsNotifsOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                {notifications.length === 0 ? (
                  <div className="text-center py-12 text-slate-400 space-y-2">
                    <p className="text-2xl">🔔</p>
                    <p className="text-xs font-bold">No new notifications</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {notifications.map(n => (
                      <div key={n.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1">
                        <p className="font-bold text-slate-900">{n.title}</p>
                        <p className="text-slate-600 text-[11px]">{n.message}</p>
                        <span className="text-[10px] text-slate-400">{n.time}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* D. HIDDEN ADMIN CONSOLE MODAL */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-800 text-white space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🛡️</span>
                    <h3 className="font-display font-black text-base">Zupix Secret Admin Console</h3>
                  </div>
                  <button onClick={() => setIsAdminOpen(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="space-y-2 text-xs">
                  <p className="text-slate-400">Total Registered Specialists: <strong className="text-white">{workers.length}</strong></p>
                  <p className="text-slate-400">Total Bookings in Database: <strong className="text-white">{bookings.length}</strong></p>
                  <p className="text-slate-400">Zero Commission Policy: <strong className="text-emerald-400">Active (100%)</strong></p>
                </div>

                <div className="space-y-2 pt-2 border-t border-slate-800">
                  <button 
                    onClick={() => {
                      localStorage.clear();
                      alert('Local cache reset! Reloading...');
                      window.location.reload();
                    }}
                    className="w-full py-2.5 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-bold hover:bg-rose-600/30"
                  >
                    Clear All Cache & Reset Seed Data
                  </button>
                  <button 
                    onClick={() => setIsAdminOpen(false)}
                    className="w-full py-2 rounded-xl text-slate-400 hover:text-white text-xs font-bold"
                  >
                    Close Admin Console
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
